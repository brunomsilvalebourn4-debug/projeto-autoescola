<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | {{ app_name or config.APP_NAME }}</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="login-logo">
            <h1 aria-hidden="true">🚘</h1>
        </div>

        <div class="login-title">
            {{ app_name or config.APP_NAME }}
        </div>
        {% if erro %}<div role="alert" class="mb-4 rounded-xl border border-red-300 bg-red-50 p-3 text-red-800">{{ erro }}</div>{% endif %}

        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="email">E-mail</label>
                <input id="email" type="email" name="email" autocomplete="username" required>
            </div>

            <br>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input id="senha" type="password" name="senha" autocomplete="current-password" required>
            </div>

            <br>

            <button class="btn btn-primary" style="width:100%;" type="submit">
                Entrar
            </button>

        </form>

    </div>

</div>

</body>
</html>

{% macro video_ajuda(titulo, descricao, video_url=None, legenda_url=None) %}<article class="rounded-2xl border bg-white p-5 shadow-sm"><h3 class="text-lg font-bold">{{ titulo }}</h3><p class="mt-2 text-slate-600">{{ descricao }}</p>{% if video_url %}<video controls preload="metadata" class="mt-4 w-full rounded-xl"><source src="{{ video_url }}">{% if legenda_url %}<track kind="captions" srclang="pt-BR" label="Português" src="{{ legenda_url }}" default>{% endif %}<p>Seu navegador não suporta vídeo. Use o material textual desta página.</p></video>{% else %}<div class="mt-4 rounded-xl border border-dashed border-slate-300 bg-slate-50 p-5 text-sm text-slate-600" role="status">Vídeo ainda não disponibilizado. Quando publicado, ele deverá incluir legendas em português.</div>{% endif %}</article>{% endmacro %}

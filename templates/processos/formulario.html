{% extends 'base.html' %}{% block content %}<h2 class="mb-6 text-3xl font-bold">Novo processo</h2><form method="post" class="space-y-5 rounded-2xl bg-white p-6"><div><label for="aluno_id" class="block font-semibold">Aluno</label><select id="aluno_id" name="aluno_id" required class="mt-1 w-full rounded-xl border p-3"><option value="">Selecione</option>{% for a in alunos %}<option value="{{ a.id }}" {% if dados.get('aluno_id')|int==a.id %}selected{% endif %}>{{ a.nome_completo }} — {{ a.cpf }}</option>{% endfor %}</select>{% if erros.aluno_id %}<p class="text-red-700">{{ erros.aluno_id }}</p>{% endif %}</div><div><label for="categoria" class="block font-semibold">Categoria</label><select id="categoria" name="categoria" class="mt-1 w-full rounded-xl border p-3">{% for c in categorias %}<option {% if dados.get('categoria')==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div><div><label for="observacoes" class="block font-semibold">Observações</label><textarea id="observacoes" name="observacoes" class="mt-1 w-full rounded-xl border p-3">{{ dados.get('observacoes','') }}</textarea></div><div class="flex justify-end gap-3"><a href="{{ url_for('processos.listar') }}" class="rounded-xl border px-5 py-3">Cancelar</a><button class="rounded-xl bg-blue-600 px-5 py-3 text-white">Criar processo</button></div></form>{% endblock %}

services:
  - type: web
    name: autoescola-web
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/autoescola.db
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: FLASK_DEBUG
        value: "false"
    disk:
      name: autoescola-data
      mountPath: /var/data
      sizeGB: 1
